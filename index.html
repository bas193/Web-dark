<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK STORE OFFICIAL</title>
<style>
  body{margin:0;background:#0A0F1E;color:#fff;font-family:'Poppins',sans-serif}
  header{background:linear-gradient(90deg,#FFC107,#FF8C00);padding:20px;text-align:center;color:#000}
  header h1{margin:0;font-size:22px}
  header p{margin:5px 0 0;font-size:13px}
  .container{padding:15px}
  .filter{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
  .btn{padding:8px 16px;border-radius:20px;background:#1E293B;border:none;color:#fff;cursor:pointer;white-space:nowrap}
  .btn.active{background:#FFC107;color:#000;font-weight:bold}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .card{background:#111827;border:1px solid #1E293B;padding:15px;border-radius:14px;text-align:center;box-shadow:0 0 10px #000}
  .card .icon{font-size:35px}
  .card h3{font-size:15px;margin:10px 0 5px}
  .harga{color:#FFC107;font-size:20px;font-weight:bold}
  .proses{font-size:12px;color:#94A3B8;margin-bottom:10px}
  .beli{width:100%;background:#22C55E;border:none;color:#fff;padding:10px;border-radius:10px;font-weight:bold;cursor:pointer}
  .beli:hover{background:#16A34A}
  footer{text-align:center;padding:20px;font-size:12px;color:#64748B}
  @media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
  <h1>⚡ DARK STORE OFFICIAL ⚡</h1>
  <p>Top Up Game & Jual Reach Channel Termurah</p>
</header>

<div class="container">
  <div class="filter" id="filter"></div>
  <div class="grid" id="produk"></div>
</div>

<footer>© 2026 DARK STORE. Order via WhatsApp</footer>

<script>
const WA = "60194939829"; // TUKAR NI

const data = {
  kategori:[{id:0,nama:"Semua",icon:"🔥"},{id:1,nama:"Reach",icon:"📈"},{id:2,nama:"FF",icon:"💎"},{id:3,nama:"ML",icon:"🛡️"}],
  produk:[
    {id:1,kat:1,nama:"10 Reach",harga:"RM0.30",proses:"1-3 Minit"},
    {id:2,kat:1,nama:"500 Reach",harga:"RM15.00",proses:"15-30 Minit"},
    {id:3,kat:1,nama:"1000 Reach",harga:"RM28.00",proses:"1 Jam"},
    {id:4,kat:2,nama:"50 Diamond FF",harga:"RM3.50",proses:"1-5 Minit"},
    {id:5,kat:2,nama:"140 Diamond FF",harga:"RM9.50",proses:"1-5 Minit"},
    {id:6,kat:3,nama:"86 Diamond ML",harga:"RM7.50",proses:"1-5 Minit"}
  ]
}

// Load filter
filter.innerHTML = data.kategori.map(k=>`<button class="btn" onclick="load(${k.id},this)">${k.icon} ${k.nama}</button>`).join('');
load(0, document.querySelector('.btn'))

function load(id,el){
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  let list = id==0 ? data.produk : data.produk.filter(p=>p.kat==id);
  produk.innerHTML = list.map(p=>{
    let kat = data.kategori.find(k=>k.id==p.kat);
    return `
    <div class="card">
      <div class="icon">${kat.icon}</div>
      <h3>${p.nama}</h3>
      <p class="proses">⚡ ${p.proses}</p>
      <p class="harga">${p.harga}</p>
      <button class="beli" onclick="wa('${p.nama}','${p.harga}')">BELI SEKARANG</button>
    </div>`}).join('');
}

function wa(nama,harga){
  window.open(`https://wa.me/${WA}?text=Halo Admin, saya mau order ${nama} - ${harga}`,'_blank')
}
</script>
</body>
</html>
